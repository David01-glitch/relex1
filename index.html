    <!-- Fonts: Fraunces (headings) + Inter (body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Google Consent Mode v2 — default denied until the visitor accepts -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      gtag('consent', 'default', {
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        analytics_storage: 'denied',
        functionality_storage: 'granted',
        security_storage: 'granted',
        wait_for_update: 500
      });
      // Restore a previously saved choice as early as possible.
      try {
        var saved = localStorage.getItem('gyc-consent');
        if (saved === 'granted') {
          gtag('consent', 'update', {
            ad_storage: 'granted',
            ad_user_data: 'granted',
            ad_personalization: 'granted',
            analytics_storage: 'granted'
          });
        }
      } catch (e) {}
    </script>

    <!-- GOOGLE TAG (GTAG.JS) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-4J046JXWVC"></script>
    <script>
      gtag('js', new Date());
      gtag('config', 'G-4J046JXWVC', { anonymize_ip: true });
    </script>

    <!-- With JavaScript disabled, force every inline accordion panel fully open
         so all content stays readable, not just present in the source. -->
    <noscript>
      <style>
        .accordion-panel { grid-template-rows: 1fr !important; }
        .accordion-inner { overflow: visible !important; }
        .js-only { display: none !important; }
      </style>
    </noscript>
